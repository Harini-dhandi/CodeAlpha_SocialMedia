<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — CodeAlpha Social</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">CodeAlpha Social</a>
    <nav class="main-nav" id="auth-area"></nav>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1>Log in</h1>
    <div id="flash"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <div class="switch-link">New here? <a href="/register.html">Create an account</a></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
function flash(type, msg) {
  qs('#flash').innerHTML = `<div class="flash ${type}">${escapeHtml(msg)}</div>`;
}
qs('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = qs('#email').value.trim();
  const password = qs('#password').value;
  const { ok, data } = await api.post('/api/login', { email, password });
  if (!ok) return flash('error', data.error || 'Login failed');
  window.location.href = '/';
});
</script>
</body>
</html>
